<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTube Ads - Advertiser Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

/* ================= BACKGROUND ================= */

body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:rgba(255,32,32,.07);
  filter:blur(100px);
  border-radius:50%;
  top:-180px;
  left:-150px;
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:400px;
  height:400px;
  background:rgba(255,32,32,.04);
  filter:blur(100px);
  border-radius:50%;
  bottom:-150px;
  right:-100px;
  pointer-events:none;
}

/* ================= HEADER ================= */

.header{
  height:72px;
  border-bottom:1px solid #242424;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:relative;
  z-index:2;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.4px;
}

.logo .mini{
  color:#fff;
}

.logo .tube{
  color:#ff2020;
}

.logo .ads{
  color:#999;
  font-weight:600;
  margin-left:4px;
}

.back{
  color:#aaa;
  font-size:14px;
  text-decoration:none;
}

.back:hover{
  color:#fff;
}

/* ================= MAIN ================= */

.main{
  min-height:calc(100vh - 72px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:45px 20px 70px;
  position:relative;
  z-index:1;
}

.login-wrapper{
  width:100%;
  max-width:450px;
}

/* ================= CARD ================= */

.login-card{
  background:rgba(17,17,17,.96);
  border:1px solid #292929;
  border-radius:20px;
  padding:34px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.45);
}

/* ================= TITLE ================= */

.icon{
  width:58px;
  height:58px;
  border-radius:15px;
  background:#1c0b0b;
  border:1px solid #492020;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:20px;
}

h1{
  font-size:29px;
  letter-spacing:-.6px;
  margin-bottom:8px;
}

.subtitle{
  color:#888;
  font-size:14px;
  line-height:1.6;
  margin-bottom:28px;
}

/* ================= FORM ================= */

.form-group{
  margin-bottom:19px;
}

label{
  display:block;
  color:#ddd;
  font-size:13px;
  font-weight:600;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:14px 15px;
  background:#090909;
  border:1px solid #333;
  color:#fff;
  border-radius:10px;
  outline:none;
  font-size:14px;
  transition:.2s;
}

input:focus{
  border-color:#ff2020;
  box-shadow:0 0 0 3px rgba(255,32,32,.08);
}

input::placeholder{
  color:#5f5f5f;
}

/* ================= PASSWORD ================= */

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:75px;
}

.show-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:transparent;
  color:#888;
  font-size:12px;
  font-weight:600;
  padding:7px;
}

.show-password:hover{
  color:#fff;
}

/* ================= OPTIONS ================= */

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:5px 0 22px;
  gap:10px;
}

.remember{
  display:flex;
  align-items:center;
  gap:8px;
  color:#888;
  font-size:12px;
}

.remember input{
  width:15px;
  height:15px;
  accent-color:#ff2020;
}

.forgot{
  color:#ff5555;
  font-size:12px;
  text-decoration:none;
}

.forgot:hover{
  color:#ff7777;
}

/* ================= BUTTON ================= */

.login-btn{
  width:100%;
  border:none;
  background:#ff2020;
  color:#fff;
  padding:14px;
  border-radius:10px;
  font-size:14px;
  font-weight:800;
  transition:.2s;
}

.login-btn:hover{
  background:#e51818;
  transform:translateY(-1px);
}

.login-btn:active{
  transform:translateY(0);
}

/* ================= DIVIDER ================= */

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  color:#555;
  font-size:11px;
  margin:25px 0;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  background:#292929;
  flex:1;
}

/* ================= OTHER LOGIN ================= */

.demo-btn{
  width:100%;
  background:#171717;
  color:#ddd;
  border:1px solid #333;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}

.demo-btn:hover{
  background:#202020;
  border-color:#444;
}

/* ================= SIGNUP ================= */

.signup{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:25px;
}

.signup a{
  color:#ff4040;
  text-decoration:none;
  font-weight:700;
}

.signup a:hover{
  color:#ff6666;
}

/* ================= SECURITY ================= */

.security{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:22px;
  color:#555;
  font-size:11px;
}

/* ================= MESSAGE ================= */

.message{
  display:none;
  padding:12px 14px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:18px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:#200d0d;
  border:1px solid #4b2020;
  color:#ff8c8c;
}

.message.success{
  display:block;
  background:#0d2115;
  border:1px solid #1e5130;
  color:#8ee0a5;
}

/* ================= LOADING ================= */

.loading{
  display:none;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= FOOTER ================= */

.footer{
  text-align:center;
  margin-top:22px;
  color:#444;
  font-size:11px;
  line-height:1.6;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

  .header{
    padding:0 20px;
  }

  .logo{
    font-size:19px;
  }

  .main{
    padding:25px 15px 50px;
    align-items:flex-start;
  }

  .login-card{
    padding:25px 20px;
    border-radius:16px;
  }

  h1{
    font-size:25px;
  }

  .options{
    align-items:flex-start;
  }

}
</style>
</head>

<body>


<!-- ================= HEADER ================= -->

<header class="header">

  <a href="index.html" class="logo">
    ▶
    <span class="mini">Mini</span><span class="tube">Tube</span>
    <span class="ads">Ads</span>
  </a>

  <a href="index.html" class="back">
    ← Back
  </a>

</header>


<!-- ================= MAIN ================= -->

<main class="main">

  <div class="login-wrapper">

    <div class="login-card">

      <div class="icon">
        📢
      </div>

      <h1>Advertiser Login</h1>

      <p class="subtitle">
        Sign in to create campaigns, manage your ads and
        track your advertising performance.
      </p>


      <!-- MESSAGE -->

      <div id="message" class="message"></div>


      <!-- ================= LOGIN FORM ================= -->

      <form id="loginForm">


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()"
              id="showPasswordBtn"
            >
              Show
            </button>

          </div>

        </div>


        <!-- OPTIONS -->

        <div class="options">

          <label class="remember">

            <input
              type="checkbox"
              id="remember"
            >

            <span>Remember me</span>

          </label>


          <a
            href="#"
            class="forgot"
            onclick="forgotPassword(event)"
          >
            Forgot password?
          </a>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >

          <span id="loginText">
            Sign In
          </span>

          <span
            class="loading"
            id="loading"
          >
            <span class="spinner"></span>
            Signing in...
          </span>

        </button>


      </form>


      <!-- DIVIDER -->

      <div class="divider">
        OR
      </div>


      <!-- DEMO LOGIN -->

      <button
        class="demo-btn"
        onclick="demoLogin()"
      >
        🚀 Try Advertiser Demo
      </button>


      <!-- SIGNUP -->

      <div class="signup">

        Don't have an advertiser account?

        <a href="advertiser-signup.html">
          Create Account
        </a>

      </div>


      <!-- SECURITY -->

      <div class="security">
        🔒 Secure advertiser access
      </div>

    </div>


    <div class="footer">

      MiniTube Ads<br>
      Advertising platform for businesses and creators

    </div>

  </div>

</main>


<script>

/* =====================================================
   MINITUBE ADS - ADVERTISER LOGIN
   FRONTEND DEMO VERSION

   Later:
   This login will connect to Supabase Auth.
===================================================== */


/* ================= PASSWORD ================= */

function togglePassword(){

  const password =
    document.getElementById("password");

  const button =
    document.getElementById("showPasswordBtn");


  if(password.type === "password"){

    password.type = "text";

    button.textContent = "Hide";

  }else{

    password.type = "password";

    button.textContent = "Show";

  }

}


/* ================= MESSAGE ================= */

function showMessage(text,type){

  const message =
    document.getElementById("message");

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display = "block";

}


function hideMessage(){

  const message =
    document.getElementById("message");

  message.style.display = "none";

}


/* ================= LOGIN ================= */

document
  .getElementById("loginForm")
  .addEventListener("submit",function(event){

    event.preventDefault();

    hideMessage();


    const email =
      document.getElementById("email")
      .value
      .trim();


    const password =
      document.getElementById("password")
      .value;


    const remember =
      document.getElementById("remember")
      .checked;


    if(!email){

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;

    }


    if(!password){

      showMessage(
        "Please enter your password.",
        "error"
      );

      return;

    }


    /* Loading */

    document
      .getElementById("loginText")
      .style.display = "none";


    document
      .getElementById("loading")
      .style.display = "flex";


    document
      .getElementById("loginButton")
      .disabled = true;


    /*
      DEMO LOGIN DELAY

      Later this section will become:

      Supabase Auth
          ↓
      authenticated user
          ↓
      advertiser dashboard
    */

    setTimeout(function(){

      const advertiser = {

        email: email,

        name:
          email
            .split("@")[0]
            .replace(/[._-]/g," "),

        role:
          "advertiser",

        loggedIn:
          true,

        loginTime:
          new Date().toISOString()

      };


      localStorage.setItem(
        "minitube_ads_advertiser",
        JSON.stringify(advertiser)
      );


      if(remember){

        localStorage.setItem(
          "minitube_ads_remember",
          "true"
        );

      }


      showMessage(
        "Login successful. Opening your dashboard...",
        "success"
      );


      setTimeout(function(){

        window.location.href =
          "advertiser-dashboard.html";

      },700);


    },900);

  });


/* ================= DEMO LOGIN ================= */

function demoLogin(){

  const demoAdvertiser = {

    email:
      "demo@minitubeads.com",

    name:
      "Demo Advertiser",

    role:
      "advertiser",

    loggedIn:
      true,

    demo:
      true,

    loginTime:
      new Date().toISOString()

  };


  localStorage.setItem(
    "minitube_ads_advertiser",
    JSON.stringify(demoAdvertiser)
  );


  showMessage(
    "Demo account ready. Opening dashboard...",
    "success"
  );


  setTimeout(function(){

    window.location.href =
      "advertiser-dashboard.html";

  },600);

}


/* ================= FORGOT PASSWORD ================= */

function forgotPassword(event){

  event.preventDefault();


  showMessage(
    "Password recovery will be connected to advertiser authentication later.",
    "error"
  );

}


/* ================= EXISTING SESSION ================= */

(function checkExistingSession(){

  const session =
    localStorage.getItem(
      "minitube_ads_advertiser"
    );


  if(!session){
    return;
  }


  try{

    const advertiser =
      JSON.parse(session);


    if(advertiser && advertiser.loggedIn){

      /*
        We intentionally don't auto-redirect here.
        The advertiser can still use the login page.
      */

    }

  }catch(error){

    localStorage.removeItem(
      "minitube_ads_advertiser"
    );

  }

})();

</script>

</body>
</html>
